name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: actdown-rs
      - name: Check tag against package versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "v$(node -p "require('./package.json').version")" = "$RELEASE_TAG"
          test "v$(sed -n 's/^version = \"\(.*\)\"/\1/p' actdown-rs/Cargo.toml | head -n 1)" = "$RELEASE_TAG"
          grep -q "^## \[${RELEASE_TAG#v}\] - " CHANGELOG.md
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm test:mcp
      - run: pnpm test:entrypoints
      - run: cargo test --manifest-path actdown-rs/Cargo.toml
      - run: cargo build --manifest-path actdown-rs/Cargo.toml --target wasm32-unknown-unknown --release
      - name: Build release assets
        run: |
          mkdir -p release
          pnpm pack --pack-destination release
          node scripts/build-playground.mjs
          cp actdown-rs/playground.html "release/actdown-playground-${GITHUB_REF_NAME}.html"
          (cd release && sha256sum -- *.tgz *.html > SHA256SUMS.txt)
      - name: Extract release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          awk -v version="${version}" 'index($0, "## [" version "] ") == 1 { capture = 1; next } capture && /^## \[/ { exit } capture { print }' CHANGELOG.md > RELEASE_NOTES.md
          test -s RELEASE_NOTES.md
      - name: Create release with assets
        uses: softprops/action-gh-release@v3
        with:
          name: actdown ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          # Stable semver tags (v0.1.1) create the latest normal release.
          # Only a suffix (v0.2.0-alpha.0) marks a GitHub prerelease.
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            release/*.tgz
            release/*.html
            release/SHA256SUMS.txt
