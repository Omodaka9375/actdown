# Deploy the project site and its fresh WASM playground to GitHub Pages.
# Requires Source: "GitHub Actions" in Settings -> Pages.
# Set the Pages custom domain to actdown.dev; it supplies the CNAME record.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "actdown-rs/src/**"
      - "actdown-rs/playground-template.html"
      - "actdown-rs/Cargo.toml"
      - "scripts/build-playground.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: actdown-rs
      - run: cargo build --manifest-path actdown-rs/Cargo.toml --target wasm32-unknown-unknown --release
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/build-playground.mjs
      - name: Assemble site
        run: |
          mkdir -p site/playground
          cp docs/index.html site/index.html
          cp actdown-rs/playground.html site/playground/index.html
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
