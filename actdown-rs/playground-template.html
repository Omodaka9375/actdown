<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>actdown playground</title>
<style>
  :root {
    --bg: #0b0f14; --pane: #0f141b; --line: #1e2733; --fg: #c9d1d9;
    --dim: #8b949e; --bright: #f0f6fc; --accent: #3fb950; --warn: #f85149;
    --blue: #58a6ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    display: flex; flex-direction: column;
  }
  header {
    flex: none; display: flex; align-items: center; gap: 12px;
    padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--pane);
  }
  header h1 { font-size: 15px; font-weight: 700; color: var(--bright); }
  header h1 b { color: var(--accent); }
  header .hint { font-size: 11px; color: var(--dim); margin-left: auto; }
  header .hint kbd {
    font-family: inherit; background: #161e28; border: 1px solid var(--line);
    border-radius: 4px; padding: 0 5px;
  }
  main { flex: 1; display: flex; min-height: 0; }
  .editor, .view { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .editor { border-right: 1px solid var(--line); }
  .bar {
    flex: none; display: flex; align-items: center; gap: 6px;
    padding: 6px 12px; background: var(--pane); border-bottom: 1px solid var(--line);
  }
  .bar .label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); margin-right: auto; }
  button.tab, .bar button {
    font: inherit; font-size: 11px; padding: 3px 10px; border-radius: 6px;
    border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer;
  }
  button.tab.on { background: #161e28; color: var(--bright); border-color: #2ea04366; }
  .bar button:hover, button.tab:hover { border-color: var(--blue); color: var(--bright); }
  /* Thin scrollbars in the theme accent (Firefox + Chromium). */
  * { scrollbar-width: thin; scrollbar-color: var(--accent) transparent; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--bright); }
  ::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }
  .wrap { flex: 1; position: relative; min-height: 0; overflow: auto; }
  textarea#src {
    position: absolute; inset: 0; width: 100%; height: 100%;
    background: transparent; color: var(--fg); border: 0; outline: 0; resize: none;
    padding: 12px 14px; font: inherit; font-size: 13px; line-height: 1.6; tab-size: 2;
  }
  pre.out {
    position: absolute; inset: 0; margin: 0; padding: 12px 14px;
    font: inherit; font-size: 12px; line-height: 1.55;
    color: var(--fg); white-space: pre-wrap; overflow-wrap: anywhere; overflow: auto;
  }
  pre.out .e { color: var(--warn); }
  select#examples {
    font: inherit; font-size: 11px; padding: 2px 6px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--pane); color: var(--fg); cursor: pointer;
  }
  select#examples:hover { border-color: var(--blue); color: var(--bright); }
  #htmlview { position: absolute; inset: 0; overflow: auto; padding: 4px 14px; }
  #htmlview.doc {
    font-family: -apple-system, "Segoe UI", sans-serif; font-size: 13px; color: #e6edf3; line-height: 1.55;
  }
  #htmlview h1, #htmlview h2 { color: var(--bright); margin: .6em 0 .3em; }
  #htmlview p { margin: .5rem 0 .8rem; }
  #htmlview ul, #htmlview ol { margin: .6rem 0 .9rem; padding-left: 1.5rem; }
  #htmlview li { margin: .25rem 0; padding-left: .15rem; }
  #htmlview li::marker { color: var(--accent); }
  #htmlview code { font-family: inherit; font-size: 12px; background: #161e28; padding: 1px 4px; border-radius: 3px; }
  #htmlview figure {
    margin: 1rem 0; padding: .75rem; overflow-x: auto;
    border: 1px solid var(--line); border-radius: 8px; background: var(--pane);
  }
  #htmlview figure[data-ad-chart]::before {
    content: attr(data-ad-chart) " chart"; display: block; margin-bottom: .5rem;
    color: var(--dim); font-size: 10px; text-transform: uppercase; letter-spacing: .08em;
  }
  #htmlview table { width: 100%; border-collapse: collapse; margin: .8rem 0; font-size: 12px; }
  #htmlview figure table { margin: 0; }
  #htmlview th, #htmlview td { border: 1px solid #263041; padding: 6px 10px; text-align: left; }
  #htmlview th { background: #141b25; color: var(--dim); }
  #htmlview tbody tr:nth-child(even) { background: #0f141b66; }
  #htmlview form {
    display: grid; gap: .75rem; max-width: 30rem; margin: 1rem 0; padding: 1rem;
    border: 1px solid var(--line); border-radius: 8px; background: var(--pane);
  }
  #htmlview .ad-field { display: grid; gap: .3rem; }
  #htmlview .ad-field > label { color: var(--dim); font-size: 11px; text-transform: capitalize; }
  #htmlview .ad-field.ad-checkbox { display: flex; align-items: center; gap: .5rem; }
  #htmlview form input:not([type="checkbox"]), #htmlview form textarea, #htmlview form select {
    width: 100%; min-width: 0; padding: .45rem .55rem; border: 1px solid #30363d; border-radius: 6px;
    background: var(--bg); color: var(--fg); font: inherit; font-size: 12px;
  }
  #htmlview form textarea { min-height: 6rem; resize: vertical; }
  #htmlview form input[type="checkbox"] { width: 1rem; height: 1rem; margin: 0; accent-color: var(--accent); }
  #htmlview form input:focus, #htmlview form textarea:focus, #htmlview form select:focus {
    outline: 1px solid var(--blue); outline-offset: 1px;
  }
  #htmlview form button[type="submit"] { justify-self: start; margin-top: .25rem; }
  #htmlview button {
    font: inherit; font-size: 12px; padding: 5px 14px; margin: 3px 4px 3px 0;
    border-radius: 6px; border: 1px solid #30363d; background: #21262d; color: var(--fg); cursor: pointer;
  }
  #htmlview button:disabled { opacity: .45; cursor: not-allowed; }
  #htmlview img { max-width: 100%; border-radius: 6px; }
  #htmlview [data-cap-missing] { border-color: var(--warn) !important; }
  footer {
    flex: none; padding: 6px 16px; font-size: 11px; color: var(--dim);
    border-top: 1px solid var(--line); background: var(--pane);
  }
  footer b { color: var(--bright); font-weight: 600; }
  footer .e { color: var(--warn); }
</style>
</head>
<body>
<header>
  <h1>actdown <b>playground</b></h1>
  <span class="hint">the whole engine is <b id="kbsize">&hellip;</b> of wasm &mdash;
  edit on the left, everything re-renders live &mdash; <kbd>Ctrl</kbd>+<kbd>Enter</kbd> re-renders now</span>
</header>
<main>
  <section class="editor">
    <div class="bar"><span class="label">document (.ad)</span><select id="examples" title="load an example document"></select></div>
    <div class="wrap"><textarea id="src" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea></div>
  </section>
  <section class="view">
    <div class="bar">
      <span class="label">output</span>
      <button class="tab on" id="tab-html">rendered</button>
      <button class="tab" id="tab-htmlstatic">html</button>
      <button class="tab" id="tab-canonical">canonical</button>
      <button class="tab" id="tab-ast">ast</button>
    </div>
    <div class="wrap">
      <div id="htmlview" class="doc"></div>
      <pre class="out" id="textout" style="display:none"></pre>
    </div>
  </section>
</main>
<footer><span id="status"></span></footer>

<script>
"use strict";
// --- sample document -------------------------------------------------------
const SAMPLE = `# Deploy approval: {service} {version}

\`\`\`ad-state
service: "checkout-service"
version: "2.4.1"
approved: false
decision: "awaiting review"
\`\`\`

\`\`\`ad-action?name=deploy.approve&role=primary&when=!approved
id: approve
on:click: cap.send("deploy.approve", {version: version})
---
Approve deploy ({version})
\`\`\`

\`\`\`ad-action?name=deploy.reject&role=danger&when=!approved
id: reject
on:click: cap.send("deploy.reject", {})
---
Reject and reopen
\`\`\`

\`\`\`ad-region
for: approve
phase: success
---
Deployed. The decision is recorded.
\`\`\`

Decision: {decision}.
`;

// --- example documents ------------------------------------------------------
// Loaded via the selector above the editor; [0] is the boot document.
const EXAMPLES = [
  { name: "deploy approval (state + actions)", src: SAMPLE },
  { name: "metrics report (charts + lists)", src: `# Weekly report

Revenue is **up 12%**, signups flat.

\`\`\`ad-chart
type: bar
data: [{"week": 1, "deploys": 4}, {"week": 2, "deploys": 9}]
\`\`\`

\`\`\`ad-chart
type: spark
data: [2, 3, 5, 8]
\`\`\`

\`\`\`ad-list
---
- shipped retry policy
- cut p95 latency by 40%
\`\`\`

\`\`\`ad-list
ordered: true
items: ["canary", "staging", "production"]
\`\`\`

| service | p95 | error rate |
| --- | --- | --- |
| checkout | 120ms | 0.1% |
| billing | 300ms | 0.4% |
` },
  { name: "contact form (controls)", src: `# Feedback

Tell us what broke. Fields validate in the host, not in the page.

\`\`\`ad-form?id=contact&action=cap:contact-form@v1
email:   input(email, required, maxlength=320)
score:   input(number, min=0, max=10)
message: textarea(maxlength=500, value="Type here")
channel: select(options=["email", "slack"], required)
agree:   checkbox
send:    submit(label="Send")
\`\`\`
` },
];

// --- wasm plumbing ---------------------------------------------------------
let exports = null;
let memory = null;

const text = (ptr, len) => {
  const bytes = new Uint8Array(memory.buffer, ptr, len);
  return new TextDecoder().decode(bytes);
};

async function boot() {
  const wasmBase64 = "@@WASM@@";
  const bytes = Uint8Array.from(atob(wasmBase64), c => c.charCodeAt(0));
  document.getElementById("kbsize").textContent =
    (bytes.length / 1024).toFixed(0) + " KB";
  const { instance } = await WebAssembly.instantiate(bytes, {});
  exports = instance.exports;
  memory = exports.memory;
}

/** Parse the current editor text. Returns true on success. */
function parseDoc() {
  const src = document.getElementById("src").value;
  const len = new TextEncoder().encode(src).length;
  const ptr = exports.ad_alloc(len);
  if (ptr === 0 && len > 0) throw new Error("ad_alloc returned null");
  new Uint8Array(memory.buffer, ptr, len).set(new TextEncoder().encode(src));
  const status = exports.ad_parse(ptr, len);
  return status === 0;
}

function lastError() {
  const p = exports.ad_err_ptr();
  if (p === 0) return "unknown error";
  return text(p, exports.ad_err_len());
}

/** Call an export that fills the output buffer; return its text or null. */
function run(renderFn) {
  if (exports[renderFn]() === 0) return text(exports.ad_ptr(), exports.ad_len());
  return null;
}

// --- rendering pipeline -----------------------------------------------------
let mode = "html";
const els = {
  src: document.getElementById("src"),
  htmlview: document.getElementById("htmlview"),
  textout: document.getElementById("textout"),
  status: document.getElementById("status"),
  examples: document.getElementById("examples"),
};

function setMode(next) {
  mode = next;
  for (const id of ["html", "htmlstatic", "canonical", "ast"]) {
    document.getElementById("tab-" + id).classList.toggle("on", id === next);
  }
  const isDoc = next === "html";
  els.htmlview.style.display = isDoc ? "" : "none";
  els.textout.style.display = isDoc ? "none" : "";
  update();
}

// Buttons do nothing in the playground (no capability host); wire them
// so the disabled state is the visible truth rather than a dead click.
// The engine's form output is label-free by contract; labels are preview-only.
function wireDocView() {
  for (const b of els.htmlview.querySelectorAll("button[data-cap-missing]")) {
    b.title = "capability not granted: host decides";
  }
  for (const b of els.htmlview.querySelectorAll("button:not([data-cap-missing])")) {
    b.addEventListener("click", () => {
      els.status.innerHTML =
        `this button names capability <b>${b.getAttribute("data-ad-fields") ? "" : ""}</b>` +
        `<b>${(b.textContent || "").trim()}</b> &mdash; a host would grant or refuse it`;
    });
  }
  for (const form of els.htmlview.querySelectorAll("form")) {
    for (const control of form.querySelectorAll("input[name], textarea[name], select[name]")) {
      const row = document.createElement("div");
      const label = document.createElement("label");
      const checkbox = control.getAttribute("type") === "checkbox";
      row.className = checkbox ? "ad-field ad-checkbox" : "ad-field";
      label.htmlFor = control.id;
      label.textContent = control.getAttribute("name") ?? "";
      control.before(row);
      if (checkbox) row.append(control, label);
      else row.append(label, control);
    }
  }
}

// Pretty-print the generated fragment without executing or normalizing it.
// Block elements get their own indented lines; inline markup stays in flow.
const BLOCK_TAGS = new Set([
  "address", "article", "aside", "blockquote", "button", "dd", "div", "dl", "dt",
  "fieldset", "figcaption", "figure", "footer", "form", "h1", "h2", "h3", "h4",
  "h5", "h6", "header", "hr", "input", "li", "main", "nav", "ol", "p", "pre",
  "script", "section", "select", "table", "tbody", "textarea", "tfoot", "th", "thead", "tr", "ul",
]);
const VOID_TAGS = new Set([
  "area", "base", "br", "col", "embed", "hr", "img", "input", "link", "meta",
  "param", "source", "track", "wbr",
]);

function formatHtml(html) {
  const lines = [];
  let current = "";
  let depth = 0;
  const flush = () => {
    if (current.trim() !== "") lines.push(current.trimEnd());
    current = "";
  };
  const tokens = html.match(/<!--[\s\S]*?-->|<[^>]+>|[^<]+/g) ?? [];
  for (const token of tokens) {
    if (!token.startsWith("<")) {
      const value = token.replace(/\s+/g, " ");
      if (value.trim() !== "") current += current === "" ? value.trimStart() : value;
      continue;
    }
    const closing = /^<\/\s*([a-zA-Z][\w-]*)/.exec(token);
    const opening = closing === null ? /^<\s*([a-zA-Z][\w-]*)/.exec(token) : null;
    const match = closing ?? opening;
    if (match === null) {
      flush();
      lines.push("  ".repeat(depth) + token);
      continue;
    }
    const tag = match[1].toLowerCase();
    if (!BLOCK_TAGS.has(tag)) {
      current += token;
      continue;
    }
    if (closing !== null) {
      depth = Math.max(0, depth - 1);
      current = current === "" ? "  ".repeat(depth) + token : current + token;
      flush();
    } else if (VOID_TAGS.has(tag) || token.endsWith("/>")) {
      flush();
      lines.push("  ".repeat(depth) + token);
    } else {
      flush();
      current = "  ".repeat(depth) + token;
      depth += 1;
    }
  }
  flush();
  return lines.join("\n");
}

function update() {
  let ok = false;
  try {
    ok = parseDoc();
  } catch (e) {
    els.status.innerHTML = `error: <span class="e">${e.message}</span>`;
    return;
  }
  if (!ok) {
    els.status.innerHTML = `parse error: <span class="e">${lastError()}</span>`;
    els.htmlview.innerHTML = "";
    els.textout.textContent = "";
    return;
  }
  const html = run("ad_render_reactive");
  if (html === null) {
    els.status.innerHTML = `render error: <span class="e">${lastError()}</span>`;
    return;
  }
  if (mode === "html") {
    els.htmlview.innerHTML = html;
    wireDocView();
    els.status.innerHTML =
      `parsed <b>ok</b> &mdash; rendered with the <b>Rust</b> engine (wasm) &mdash; ` +
      `<b>${html.length}</b> bytes of html`;
  } else if (mode === "htmlstatic") {
    const staticHtml = run("ad_render");
    if (staticHtml === null) {
      els.status.innerHTML = `render error: <span class="e">${lastError()}</span>`;
      return;
    }
    els.textout.textContent = formatHtml(staticHtml);
    els.status.innerHTML =
      `parsed <b>ok</b> &mdash; static level-1 html source (no state applied)`;
  } else if (mode === "canonical") {
    const canonical = run("ad_format");
    els.textout.textContent = canonical ?? "";
    els.status.innerHTML =
      `parsed <b>ok</b> &mdash; canonical text (SPEC 9/10, idempotent + diffable)`;
  } else if (mode === "ast") {
    const ast = run("ad_ast");
    els.textout.textContent = ast ?? "";
    els.status.innerHTML = `parsed <b>ok</b> &mdash; JSON AST (SPEC 8)`;
  }
}

// --- wire up -----------------------------------------------------------------
for (const id of ["html", "htmlstatic", "canonical", "ast"]) {
  document.getElementById("tab-" + id).addEventListener("click", () => setMode(id));
}
for (const [i, ex] of EXAMPLES.entries()) {
  const o = document.createElement("option");
  o.value = String(i);
  o.textContent = ex.name;
  els.examples.appendChild(o);
}
els.examples.addEventListener("change", () => {
  const ex = EXAMPLES[Number(els.examples.value)];
  if (ex === undefined) return;
  els.src.value = ex.src;
  update();
});
let timer = null;
els.src.addEventListener("input", () => {
  clearTimeout(timer);
  timer = setTimeout(update, 220);
});
els.src.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); update(); }
});

boot()
  .then(() => {
    els.src.value = EXAMPLES[0].src;
    update();
  })
  .catch(err => {
    els.status.innerHTML = `wasm boot failed: <span class="e">${err.message}</span>`;
  });
</script>
</body>
</html>
