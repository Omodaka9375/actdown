[package]
name = "actdown"
version = "0.1.1"
edition = "2021"
description = "Actionable Markdown for agents and humans (spec draft 0.1) - Rust/WASM port"
license = "Apache-2.0"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.11"
indexmap = { version = "2", features = ["serde"] }
